<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F1F1F" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded app icon container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#333333" stroke-width="8" />

  <!-- Outer subtle circuit glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#262626" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Two Person Node Links -->
  <circle cx="176" cy="256" r="48" fill="#141414" stroke="url(#shieldGrad)" stroke-width="6" />
  <circle cx="336" cy="256" r="48" fill="#141414" stroke="url(#shieldGrad)" stroke-width="6" />

  <!-- Person 1 silhouette -->
  <circle cx="176" cy="242" r="16" fill="#F0F0F0" />
  <path d="M152 276 C152 264, 200 264, 200 276" fill="none" stroke="#F0F0F0" stroke-width="6" stroke-linecap="round" />

  <!-- Person 2 silhouette -->
  <circle cx="336" cy="242" r="16" fill="#F0F0F0" />
  <path d="M312 276 C312 264, 360 264, 360 276" fill="none" stroke="#F0F0F0" stroke-width="6" stroke-linecap="round" />

  <!-- Secure Encrypted Central Link Bridge -->
  <path d="M224 256 L288 256" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Center Lock & Flame Shield -->
  <rect x="236" y="236" width="40" height="40" rx="10" fill="#0C0C0C" stroke="#10B981" stroke-width="4" />
  <circle cx="256" cy="252" r="4" fill="#10B981" />
  <path d="M256 256 L256 264" stroke="#10B981" stroke-width="3" stroke-linecap="round" />

  <!-- 2P Tag at Bottom -->
  <rect x="216" y="360" width="80" height="28" rx="8" fill="#1A1A1A" stroke="#444" stroke-width="2" />
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">2P E2E</text>
</svg>
